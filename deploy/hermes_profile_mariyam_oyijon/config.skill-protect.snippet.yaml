# Profile guard for mariyam_oyijon (ТЗ security-critical SOUL.md)
# Merge into: ~/.hermes/profiles/mariyam_oyijon/config.yaml
# Root cause (Stage 5 E2E, 2026-07-13): post-turn background self-improvement
# fork (agent/background_review.py + turn_finalizer.py) called skill_manage
# and delivered "💾 Self-improvement review: Patched SKILL.md…" to Telegram.
#
# Hermes sources of truth (v0.18.x):
# - agent/agent_init.py: skills.creation_nudge_interval → _skill_nudge_interval
# - agent/turn_finalizer.py: review_skills only if interval>0 AND skill_manage present
# - agent/background_review.py: notify line + background_review_callback
# - display.memory_notifications: off | on | verbose
# - display.busy_ack_enabled: false suppresses gateway busy acknowledgements
#   (including the one-time /busy onboarding tip) without changing how the
#   incoming message interrupts, queues, or steers the active turn
# - display.long_running_notifications: false suppresses English "Working"
#   gateway heartbeats while the agent is handling a long turn
# - skills.write_approval: stage skill writes instead of immediate commit
# - agent.disabled_toolsets: gateway/run.py loads into AIAgent
# - toolset name "skills" → skills_list, skill_view, skill_manage (toolsets.py)
# - toolset name "terminal" → terminal, process (toolsets.py)
# - toolset name "code_execution" → execute_code (toolsets.py)

# fix16: use a named custom provider. A bare top-level `provider: custom`
# without model.base_url is incomplete in Hermes v0.18.2 and resolves through
# the OpenRouter default, even when N1N_API_KEY exists. The named route binds
# the endpoint and its key without storing the secret in YAML.
model:
  default: gpt-5.6-luna
  provider: custom:n1n

providers:
  n1n:
    name: n1n
    base_url: https://api.n1n.ai/v1
    key_env: N1N_API_KEY
    default_model: gpt-5.6-luna
    transport: chat_completions

skills:
  # `skills.enabled` is not a Hermes v0.18.2 loader key. Mariyam's canonical
  # contract is profile/SOUL.md, which Hermes injects directly.
  creation_nudge_interval: 0
  # If skill_manage is ever re-enabled, stage writes for human approval
  # (applies to foreground AND background review fork).
  write_approval: true

display:
  # No "💾 Self-improvement review: …" messages to end users (Telegram).
  memory_notifications: "off"
  # No Hermes ⚡/⏳/⏩ busy acknowledgements or one-time English /busy tip in
  # Mariyam's chat. The incoming message is still processed normally.
  busy_ack_enabled: false
  # No English "⏳ Working — N min" framework heartbeat in Mariyam's chat.
  long_running_notifications: false
  tool_progress: false

agent:
  # Six model iterations preserve existing Stage 5-5.2 workflows while capping
  # a turn even if the model ignores DUPLICATE_SUCCESS_BLOCKED.
  max_turns: 6
  # Disable skill management and all command-execution surfaces for Mariyam only.
  # SOUL.md remains in the system prompt; MCP/cron/memory stay available.
  # Hermes v0.18.2 does not place execute_code in "terminal": both supported
  # toolsets must be disabled to remove terminal/process/execute_code.
  #
  # Token audit 2026-07-28 (docs/AUDIT_TOKENS_PERSONA_2026-07.md): the toolsets
  # below cost 7 255 o200k tokens in EVERY request and are never used by any
  # ТЗ scenario — Mariyam has no browser, no filesystem, no sub-agents and no
  # TTS (voice output disabled by the customer). Keep `cronjob` (reminders,
  # SOUL §9) and `memory` (preferences) enabled.
  disabled_toolsets:
    - skills
    - terminal
    - code_execution
    - browser
    - file
    - delegation
    - session_search
    - image_gen
    - vision
    - tts
    - todo
    - clarify

# fix08: DeepSeek remains excluded after false mutation reports, internal-text
# leaks and unstable Uzbek in live Telegram. The only fallback is the SAME Luna
# model through independent OpenRouter infrastructure, protecting against n1n
# route failures without changing model behavior or the available tool set.
fallback_providers:
  - provider: openrouter
    model: openai/gpt-5.6-luna

plugins:
  # Explicit order keeps identity binding before behavior-changing tool guards.
  # Health also registers pre_gateway_dispatch for deterministic alerts.
  enabled:
    - mariyam_identity_guard
    - mariyam_health_guard
    - mariyam_cron_reliability
    - mariyam_stage53_guard
    # Rotates a due daily route before generic DB recovery can reopen the
    # ended session; also classifies empty length/no-usage as provider failure.
    - mariyam_runtime_guard
    # Drops English framework status lines (provider-fallback notice) that
    # Hermes has no config key for. See deploy/hermes_plugins/
    # mariyam_outbound_filter/__init__.py.
    - mariyam_outbound_filter

# Memory freshness (imp05-opus, root cause of "Mariyam does not remember the
# family", live 2026-08-01):
# - tools/memory_tool.py injects MEMORY.md / USER.md as a FROZEN snapshot taken
#   when the system prompt is built; the memory tool has no read action, so the
#   model can only see what that snapshot held.
# - agent/conversation_loop.py::_restore_or_build_system_prompt reuses the
#   system prompt stored in state.db verbatim for the whole life of a session.
# - gateway/config.py SessionResetPolicy defaults to mode "none" (July 2026),
#   so a Telegram session never rolls over and a memory write performed after
#   the session started stays invisible to the model forever.
# Daily rollover at 02:00 Asia/Tashkent (Oyijon asleep, outside every cron slot)
# rebuilds the prompt once a day, so memory written on day N is in the prompt
# on day N+1. notify: false keeps Hermes' English reset notice out of the chat.
session_reset:
  mode: daily
  at_hour: 2
  notify: false
